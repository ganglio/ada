[project]
name = "ada"
version = "0.0.0"
description = "Always-listening voice companion for a Raspberry Pi 5 (V0 runs on a dev machine)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ada"]

[tool.ruff]
line-length = 100
src = ["src", "spike", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
